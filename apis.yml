name: One
description: OnePay (formerly One / One Finance) is a Walmart-backed consumer fintech
  that delivers a single mobile app combining banking, high-yield savings, a CashRewards
  debit card, a credit-building card, buy-now-pay-later, investing, cryptocurrency
  trading, and tax filing. Banking services are provided through partner banks Coastal
  Community Bank and Lead Bank (Members FDIC). The product is consumer-facing with no
  public developer API; a partner/developer portal exists behind authentication at
  developer.onepay.com. Originally surfaced as a portfolio company of Obvious Ventures
  and added to the API Evangelist network as a lead for enrichment.
